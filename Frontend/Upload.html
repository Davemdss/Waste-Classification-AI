<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Upload.css">
    <title>Waste Aware - Upload Image</title>
</head>
<body>
    <header>Waste Aware</header>
    <nav>
        <a href="Home.html">Home</a>
        <a href="Upload.html" class="active">Upload</a>
        <a href="About.html">About</a>
        <a href="Login.html">Get Started</a>
    </nav>
    <div class="container">
        <div class="content">
            <h1>Upload Image</h1>
            <p>Upload a photo to identify your waste instantly. Our AI will quickly classify what waste category it is on, making waste separation easier than ever.</p>
            
            <!-- Alert for results -->
            <div id="resultAlert" style="display: none; padding: 10px; background-color: #4CAF50; color: white; margin-bottom: 20px; text-align: center;"></div>
            
            <!-- Camera Upload Section -->
            <div class="camera-container" id="drop-area">
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
                <p id="drop-area-text">Drag and drop an image here, or click to select one.</p>
            </div>
            
            <!-- Image Preview -->
            <img id="previewImage" style="display:none; max-width: 100%; height: auto; margin-top: 20px;">

            <!-- Classify Button -->
            <button id="classifyButton" style="display: none;" disabled>Classify Image</button>
            
            <!-- Waste Information Section -->
            <div id="wasteInfo" style="display: none; padding: 20px; background-color: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; margin-top: 20px;">
                <h2 id="wasteTitle" style="color: #333; font-size: 1.5em; margin-bottom: 10px;"></h2>
                <p id="wasteCategory" style="margin: 5px 0; color: #555;"></p>
                <p id="wasteExplanation" style="margin: 5px 0; color: #555;"></p>
                <p id="wasteManagement" style="margin: 5px 0; color: #555;"></p>
                <p id="wasteBin" style="margin: 5px 0; color: #555;"></p>
            </div>
        </div>
    </div>
    <footer>&copy; 2024 Waste Aware</footer>

    <script src="Upload.js"></script>
</body>
</html>
